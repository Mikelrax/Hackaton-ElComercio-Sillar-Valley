server:
  port: 8080

spring:
  application:
    name: ayni

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ayni}
    username: ${DB_USER:ayni}
    password: ${DB_PASSWORD:ayni}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt-secret: ${JWT_SECRET:AYNI-local-secret-key-change-before-production-2026}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  moderator-invite-code: ${MODERATOR_INVITE_CODE:JUNTA2026}
  timezone: America/Lima
  country-code: "51"
  upload-dir: ${UPLOAD_DIR:uploads}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  seed: ${APP_SEED:true}
