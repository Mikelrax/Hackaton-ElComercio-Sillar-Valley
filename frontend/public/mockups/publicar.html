<div style="width: 390px; margin: 0 auto">

<button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 76px; padding: 14px; border-radius: 16px; font: inherit; text-align: left; border: 1px solid #FCA5A5; background: #FFFFFF; color: #B91C1C;">
